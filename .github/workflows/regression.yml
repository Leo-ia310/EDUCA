name: Regression

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Harness creates temporary loopback PostgreSQL, never reads .env or uses
      # repository secrets. No hosted database, emails, push or production load.
      - run: npm test
        env:
          NODE_ENV: test
      - run: npm run build
      - name: Generated API documentation is current
        run: git diff --exit-code -- ../docs/APIS_PENDIENTES_POR_CONECTAR.md ../docs/openapi.json
      - name: Shared Edge algorithm matches the Node source
        run: node scripts/build-originality-edge.cjs --check

  originality-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.6.8'
      - run: deno check --frozen --config supabase/functions/nivra-originality/deno.json supabase/functions/nivra-originality/index.ts
      - run: deno test --frozen --config supabase/functions/nivra-originality/deno.json --allow-read --allow-env=NODE_ENV --deny-net supabase/functions/nivra-originality/test/edge_test.ts
      - run: deno test --frozen --config supabase/functions/nivra-originality/deno.json --allow-read --allow-env=NODE_ENV --allow-net=127.0.0.1 supabase/functions/nivra-originality/test/http_test.ts

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test --no-pub
