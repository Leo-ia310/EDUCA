name: educa360
description: Plataforma educativa SaaS multi-institución para colegios, institutos y universidades.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado y arquitectura
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5

  # Routing
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.6

  # Persistencia local
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Red y conectividad
  connectivity_plus: ^6.0.3
  dio: ^5.4.3+1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.0
  fl_chart: ^0.68.0

  # Notificaciones push
  # Educa360 NO usa Firebase. El push real es Web Push estándar (VAPID) vía
  # `WebPushService` (solo Flutter Web) + la Edge Function
  # `supabase/functions/send-push/`. Ver `notifications/data/web_push_service.dart`.
  web: ^1.1.0
  flutter_local_notifications: ^17.1.2

  # Archivos / PDF
  file_picker: ^8.0.5
  image_picker: ^1.1.2
  open_filex: ^4.4.0
  pdf: ^3.11.0
  printing: ^5.13.1
  path: ^1.9.0

  # Internacionalización y fechas
  intl: ^0.20.2

  # Utilidades
  collection: ^1.18.0
  uuid: ^4.4.0
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  # fonts: configuradas via google_fonts (Plus Jakarta Sans)
